<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomingZone — Apple TV inspired</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.screen{height:100%;min-height:420px;position:relative;background:radial-gradient(ellipse at 74% 22%,#536a7b 0%,#27384a 28%,transparent 62%),linear-gradient(135deg,#263c4d,#171e2c 55%,#080b12);padding:28px 4vw}
.top{display:flex;justify-content:flex-end;align-items:center;gap:10px}.clock{padding:9px 16px;border-radius:30px;background:#ffffff20;font-size:clamp(11px,1vw,14px);backdrop-filter:blur(18px)}.profile,.settings{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#40aaef,#dc4ca1 55%,#fabe47);font-size:22px}.settings{border-radius:50%;background:#ffffff20}
.dock{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(88%,1100px);padding:14px;display:flex;justify-content:center;gap:clamp(4px,1vw,14px)}
.tile{width:clamp(74px,10vw,126px);height:clamp(74px,10vw,112px);border:1px solid transparent;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;background:#ffffff08;outline:0}.tile .ico{width:clamp(48px,6vw,72px);height:clamp(48px,6vw,72px);border-radius:15px;display:grid;place-items:center;font-size:clamp(25px,3.5vw,40px);font-weight:800}.tile:focus,.tile.sel{transform:scale(1.1);background:#ffffff25;border-color:#ffffff70;box-shadow:0 12px 30px #0008}.hint{display:none}
@media(max-width:650px){.dock{width:94%;gap:2px;padding:8px}.tile{width:14%;height:76px}}
</style></head><body><main class="screen"><header class="top"><div class="clock" id="clock"></div><div class="profile">●</div><button class="settings" id="settings">⚙</button></header>
<nav class="dock" id="dock"></nav><div class="hint">Arrow keys to move · Enter to select</div></main>
<script>
const apps=[['Apple TV','tv','#111'],['Netflix','N','#e50914'],['YouTube','▶','#e62117'],['Prime Video','prime','#168bd2'],['VLC','▲','#ef8c21'],['Music','♫','#e83c65'],['Photos','✿','#37a66b'],['Settings','⚙','#65748b']];
const dock=document.querySelector('#dock');let selected=0;
function choose(i){selected=(i+apps.length)%apps.length;[...dock.children].forEach((el,j)=>el.classList.toggle('sel',j===selected))}
apps.forEach((a,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<div class="ico" style="background:'+a[2]+'">'+a[1]+'</div>';b.addEventListener('focus',()=>choose(i));b.addEventListener('click',()=>choose(i));dock.appendChild(b)});
document.querySelector('#settings').addEventListener('click',()=>alert('Settings\\n\\nWallpaper: cinematic wallpaper\\nInstalled applications: '+apps.length+'\\nAbout HomingZone: Version 0.1.0'));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();dock.children[(selected+1)%apps.length].focus()}if(e.key==='ArrowLeft'){e.preventDefault();dock.children[(selected+apps.length-1)%apps.length].focus()}});
function tick(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',weekday:'short',day:'numeric',month:'short'}).format(new Date())}tick();setInterval(tick,30000);choose(0);
</script></body></html>
