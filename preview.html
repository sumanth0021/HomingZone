<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HomingZone preview</title>
    <style>
        :root {
            color-scheme: dark;
            --u: min(1px, calc(100vw/980));
            --bg: #080b12;
            --fg: #fff;
            --muted: #ffffffbe;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden
        }

        .screen {
            position: relative;
            height: 100%;
            min-height: calc(430*var(--u));
            background: linear-gradient(135deg, #273e52, #232b3b 35%, #0a0d14 70%, #080a0f);
            overflow: hidden
        }

        .glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 76%;
            background: linear-gradient(135deg, #5e7e9161, #47576f23, transparent);
            border-radius: calc(36*var(--u))
        }

        .top {
            position: absolute;
            top: calc(24*var(--u));
            left: calc(42*var(--u));
            right: calc(42*var(--u));
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .clock {
            padding: calc(9*var(--u)) calc(16*var(--u));
            border-radius: calc(22*var(--u));
            background: #ffffff4b;
            font-size: calc(14*var(--u));
            font-weight: 700;
            color: var(--muted)
        }

        .gear {
            width: calc(48*var(--u));
            height: calc(48*var(--u));
            border-radius: calc(22*var(--u));
            background: #ffffff4b;
            display: grid;
            place-items: center;
            font-size: calc(22*var(--u));
            cursor: pointer
        }

        .hero {
            position: absolute;
            left: calc(64*var(--u));
            right: calc(50*var(--u));
            top: calc(76*var(--u));
            bottom: calc(205*var(--u));
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .hero h1 {
            margin: 0;
            font-size: calc(42*var(--u));
            font-weight: 700;
            white-space: nowrap
        }

        .hero p {
            margin: calc(12*var(--u)) 0 0;
            font-size: calc(17*var(--u));
            color: var(--muted)
        }

        .big {
            width: calc(220*var(--u));
            height: calc(190*var(--u));
            border-radius: calc(34*var(--u));
            background: #ffffff19;
            display: grid;
            place-items: center
        }

        .big .i {
            width: calc(150*var(--u));
            height: calc(150*var(--u));
            border-radius: calc(30*var(--u));
            display: grid;
            place-items: center;
            font-size: calc(64*var(--u));
            font-weight: 800
        }

        .shell {
            position: absolute;
            left: calc(18*var(--u));
            right: calc(18*var(--u));
            bottom: calc(32*var(--u));
            height: calc(148*var(--u));
            border-radius: calc(30*var(--u));
            background: #1c1a1878;
            border: 1px solid #ffffff2d
        }

        .scroll {
            height: 100%;
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: none
        }

        .scroll::-webkit-scrollbar {
            display: none
        }

        .dock {
            height: 100%;
            display: inline-flex;
            align-items: center;
            padding: 0 calc(30*var(--u))
        }

        .tile {
            flex: none;
            width: calc(168*var(--u));
            height: calc(100*var(--u));
            margin: 0 calc(17*var(--u));
            border-radius: calc(16*var(--u));
            border: 1px solid #ffffff1e;
            display: grid;
            place-items: center;
            cursor: pointer;
            outline: 0;
            color: #fff;
            font-weight: 800;
            font-size: calc(38*var(--u));
            box-shadow: 0 2px 6px #0004;
            transition: transform .16s, box-shadow .16s, border-color .16s;
            position: relative;
            overflow: hidden
        }

        .tile.on {
            transform: scale(1.2);
            border-color: transparent;
            box-shadow: none;
            z-index: 2
        }

        .hint {
            position: absolute;
            bottom: calc(8*var(--u));
            left: 0;
            right: 0;
            text-align: center;
            font-size: calc(12*var(--u));
            color: #ffffff7d
        }

        .ring {
            width: calc(54*var(--u));
            height: calc(54*var(--u));
            border-radius: 50%;
            border: calc(8*var(--u)) solid #e8225a;
            box-shadow: inset 0 0 0 calc(8*var(--u)) #a6f31f, inset 0 0 0 calc(16*var(--u)) #1fd3d3
        }
    </style>
</head>

<body>
    <main class="screen">
        <div class="glow"></div>
        <div class="top">
            <div class="clock" id="clock"></div>
            <div class="gear" id="settings" tabindex="0" role="button" aria-label="Settings">⚙</div>
        </div>
        <section class="hero">
            <div>
                <h1 id="t"></h1>
                <p id="s"></p>
            </div>
            <div class="big">
                <div class="i" id="b"></div>
            </div>
        </section>
        <div class="shell">
            <div class="scroll" id="sc">
                <div class="dock" id="dock"></div>
            </div>
        </div>
        <div class="hint">Use ← → to move · Enter to open · or click a tile</div>
    </main>
    <script>
        const apps = [
            ["Apple TV", "tv", "linear-gradient(#2c2c30,#161619)"],
            ["Arcade", "🕹", "linear-gradient(135deg,#ff5f6d,#f0386b)"],
            ["Fitness", "ring", "linear-gradient(#202023,#111113)"],
            ["FaceTime", "🎥", "linear-gradient(#52d95f,#2fb64a)"],
            ["Music", "♫", "linear-gradient(135deg,#f55a6c,#e8334d)"],
            ["App Store", "A", "linear-gradient(#2aa9ff,#1a6bf0)"],
            ["YouTube", "▶", "linear-gradient(#e62117,#a80f0a)"],
            ["Netflix", "N", "linear-gradient(#e50914,#6b0309)"],
            ["VLC", "▲", "linear-gradient(#f59a2e,#d96b0c)"]];
        const dock = document.getElementById("dock"), sc = document.getElementById("sc"); let cur = 0;
        document.getElementById("settings").onclick = () => window.alert("Settings");
        document.getElementById("settings").onkeydown = e => { if (e.key === "Enter" || e.key === " ") window.alert("Settings") };
        function face(a) { return a[1] === "ring" ? '<div class="ring"></div>' : a[1] === "tv" ? "tv" : a[1] }
        apps.forEach((a, i) => { const d = document.createElement("div"); d.className = "tile"; d.style.background = a[2]; d.innerHTML = face(a); d.onclick = () => go(i); dock.appendChild(d) });
        function go(i) {
            cur = (i + apps.length) % apps.length;[...dock.children].forEach((e, j) => e.classList.toggle("on", j === cur));
            const a = apps[cur]; document.getElementById("t").textContent = a[0]; document.getElementById("s").textContent = "Ready to open · com.example." + a[0].toLowerCase().replace(/\s/g, "");
            const b = document.getElementById("b"); b.style.background = a[2]; b.innerHTML = face(a);
            const t = dock.children[cur]; sc.scrollTo({ left: t.offsetLeft - 60, behavior: "smooth" })
        }
        document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1) } if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1) } });
        function tick() { document.getElementById("clock").textContent = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", weekday: "short", day: "numeric", month: "short" }).format(new Date()) }
        tick(); setInterval(tick, 30000); go(0);
    </script>
</body>

</html>
