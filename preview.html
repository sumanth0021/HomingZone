<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomingZone — Apple TV inspired</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.screen{height:100%;min-height:420px;position:relative;background:radial-gradient(ellipse at 74% 22%,#536a7b 0%,#27384a 28%,transparent 62%),linear-gradient(135deg,#263c4d,#171e2c 55%,#080b12);padding:28px 4vw}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:clamp(16px,1.7vw,24px);font-weight:700;letter-spacing:.02em}.clock{padding:9px 16px;border-radius:30px;background:#ffffff20;font-size:clamp(11px,1vw,14px);backdrop-filter:blur(18px)}
.hero{position:absolute;left:7%;right:7%;top:22%;height:43%;display:flex;align-items:center;justify-content:space-between}.copy h1{font-size:clamp(34px,5vw,76px);margin:0 0 14px;letter-spacing:-.04em}.copy p{font-size:clamp(13px,1.4vw,19px);color:#ffffffb8;margin:0}.bigicon{width:clamp(110px,17vw,220px);height:clamp(110px,17vw,220px);border-radius:26%;display:grid;place-items:center;font-size:clamp(52px,8vw,100px);background:#ffffff18;box-shadow:0 28px 90px #0006;backdrop-filter:blur(20px)}
.dock{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(88%,1100px);padding:14px;border-radius:28px;background:#090b10a8;border:1px solid #ffffff20;box-shadow:0 22px 70px #0008;backdrop-filter:blur(24px);display:flex;justify-content:center;gap:clamp(4px,1vw,14px)}
.tile{width:clamp(74px,10vw,126px);height:clamp(82px,10vw,112px);border:1px solid transparent;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:.16s;background:#ffffff08;outline:0}.tile .ico{width:clamp(38px,5vw,58px);height:clamp(38px,5vw,58px);border-radius:15px;display:grid;place-items:center;font-size:clamp(21px,3vw,34px);font-weight:800}.tile span{font-size:clamp(9px,.9vw,12px);color:#ffffffd0}.tile:focus,.tile.sel{transform:scale(1.13) translateY(-7px);background:#ffffff25;border-color:#ffffff70;box-shadow:0 12px 30px #0008}.hint{position:absolute;bottom:2%;width:100%;left:0;text-align:center;color:#ffffff70;font-size:11px}
@media(max-width:650px){.dock{width:94%;gap:2px;padding:8px}.tile{width:14%;height:76px}.tile span{font-size:8px}.hero{top:20%}.bigicon{width:100px;height:100px}}
</style></head><body><main class="screen"><header class="top"><div class="brand">HomingZone</div><div class="clock" id="clock"></div></header>
<section class="hero"><div class="copy"><h1 id="title">Welcome home</h1><p id="subtitle">Choose something to watch, play or enjoy.</p></div><div class="bigicon" id="big">⌂</div></section>
<nav class="dock" id="dock"></nav><div class="hint">Arrow keys to move · Enter to select</div></main>
<script>
const apps=[['Apple TV','tv','#111'],['Netflix','N','#e50914'],['YouTube','▶','#e62117'],['Prime Video','prime','#168bd2'],['VLC','▲','#ef8c21'],['Music','♫','#e83c65'],['Photos','✿','#37a66b'],['Settings','⚙','#65748b']];
const dock=document.querySelector('#dock');let selected=0;
function choose(i){selected=(i+apps.length)%apps.length;[...dock.children].forEach((el,j)=>el.classList.toggle('sel',j===selected));document.querySelector('#title').textContent=apps[selected][0];document.querySelector('#subtitle').textContent='Ready to open · '+apps[selected][0];document.querySelector('#big').textContent=apps[selected][1];document.querySelector('#big').style.background='linear-gradient(145deg,'+apps[selected][2]+',#ffffff20)'}
apps.forEach((a,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<div class="ico" style="background:'+a[2]+'">'+a[1]+'</div><span>'+a[0]+'</span>';b.addEventListener('focus',()=>choose(i));b.addEventListener('click',()=>choose(i));dock.appendChild(b)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();dock.children[(selected+1)%apps.length].focus()}if(e.key==='ArrowLeft'){e.preventDefault();dock.children[(selected+apps.length-1)%apps.length].focus()}});
function tick(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',weekday:'short',day:'numeric',month:'short'}).format(new Date())}tick();setInterval(tick,30000);choose(0);
</script></body></html>
