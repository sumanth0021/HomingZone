<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomingZone preview</title>
<style>
/*
  Design preview of LauncherActivity. One CSS pixel here = one dp on the TV.
  Reference screen: 1280x720 @ 213 dpi = 961 x 541 dp. The whole stage is scaled to fit the window.
  Keep these numbers in sync with the constants at the top of LauncherActivity.java.
  This page cannot verify real Android TV remote behaviour - only the look.
*/
:root { --glass: rgba(124,130,144,.373); --label: rgba(255,255,255,.647); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #06080d; overflow: hidden;
  font-family: Roboto, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
#stage { position: absolute; left: 0; top: 0; width: 961px; height: 541px; overflow: hidden;
  transform-origin: 0 0; background: linear-gradient(#142030, #06080d); }
#stage > * { position: absolute; }

.wallpaper { inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dim { inset: 0; background: rgba(0,0,0,.157); }
.shade-top { left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(rgba(0,0,0,.47), rgba(0,0,0,0)); }
.shade-bottom { left: 0; right: 0; bottom: 0; height: 280px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.784)); }

/* Top-right: settings button + clock/profile pill */
.bar { top: 27px; right: 48px; display: flex; align-items: center; }
.gear { width: 38px; height: 38px; border-radius: 50%; background: var(--glass); padding: 9px;
  transition: transform .15s ease-out; outline: 0; }
.gear svg { width: 100%; height: 100%; fill: #fff; display: block; }
.gear.focus { background: rgba(245,245,248,.94); transform: scale(1.12); }
.gear.focus svg { fill: #14161c; }
.pill { margin-left: 10px; height: 38px; padding: 5px 5px 5px 16px; border-radius: 50px; background: var(--glass);
  display: flex; align-items: center; }
.clock { font-weight: 500; font-size: 15px; color: rgba(255,255,255,.92); }
.avatar { margin-left: 12px; width: 28px; height: 28px; border-radius: 50%; padding: 5px;
  background: linear-gradient(135deg, #808eb2, #424c6e); }
.avatar svg { width: 100%; height: 100%; fill: #fff; display: block; }

/* Dock */
.dock { left: 48px; right: 48px; bottom: 35px; height: 128px; border-radius: 30px; overflow: hidden;
  background: linear-gradient(rgba(124,130,144,.373), rgba(58,62,74,.373)); }
.scroll { position: absolute; inset: 0; }
.row { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; padding: 0 22px;
  transition: transform .25s ease-out; }
.entry { width: 144px; margin: 0 11px; flex: none; position: relative; }
.entry.focus { z-index: 2; }
.tile { position: relative; width: 144px; height: 81px; border-radius: 14px; overflow: hidden;
  background: linear-gradient(#30323a, #18191f); display: grid; place-items: center;
  transition: transform .15s ease-out, box-shadow .15s ease-out; }
.entry.focus .tile { transform: scale(1.15); box-shadow: 0 10px 24px rgba(0,0,0,.55); }
.entry.focus .tile::after { content: ""; position: absolute; inset: 0; border-radius: 14px; border: 2px solid rgba(255,255,255,.84); }
.tile .banner { position: absolute; inset: 0; display: grid; place-items: center; color: #fff;
  font-weight: 700; font-size: 22px; letter-spacing: .02em; }
.tile .icon { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: 24px; }
.name { margin-top: 8px; height: 20px; line-height: 20px; text-align: center; font-size: 14px; font-weight: 500;
  color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry.focus .name { color: #fff; }

.note { position: fixed; left: 10px; bottom: 6px; font-size: 11px; color: rgba(255,255,255,.45); z-index: 5; }
</style>
</head>
<body>
<div id="stage">
  <img class="wallpaper" src="app/src/main/res/drawable-nodpi/wallpaper_default.jpg" alt="">
  <div class="dim"></div>
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>

  <div class="dock"><div class="scroll"><div class="row" id="row"></div></div></div>

  <div class="bar">
    <div class="gear" id="gear" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
    </div>
    <div class="pill">
      <span class="clock" id="clock"></span>
      <div class="avatar"><svg viewBox="0 0 24 24"><path d="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z"/></svg></div>
    </div>
  </div>
</div>
<div class="note" id="note">Design preview · arrow keys move focus · it cannot test real TV remote behaviour</div>

<script>
// Sample apps. "banner" tiles imitate an app that ships TV artwork; the others show the app icon on a dark tile.
var APPS = [
  {n:'Cinema',       banner:['#8a2c3a','#3a1220'], t:'CINEMA'},
  {n:'Clips',        icon:'#d0413a', t:'▶'},
  {n:'Stream+',      banner:['#1f6fb5','#0f2f55'], t:'Stream+'},
  {n:'Media Player', icon:'#e8862a', t:'M'},
  {n:'Music',        banner:['#1d8a5b','#0b3a2a'], t:'Music'},
  {n:'Kodi',         icon:'#2a8fc7', t:'K'},
  {n:'Photos',       banner:['#7a4fd0','#2a1a55'], t:'Photos'},
  {n:'Files',        icon:'#c28a2c', t:'F'},
  {n:'Play Store',   icon:'#1fa463', t:'P'},
  {n:'Live TV',      banner:['#2b5fa0','#101e3c'], t:'LIVE'},
  {n:'Games',        icon:'#6b4fd6', t:'G'},
  {n:'A very long app name', icon:'#5b6b86', t:'L'}
];
var TILE_W = 144, GAP = 22, PAD = 22, VIEWPORT = 961 - 96;   // dock width = stage - 2 * SAFE_H
var row = document.getElementById('row'), entries = [], cur = 0, onGear = false;
var gear = document.getElementById('gear');

APPS.forEach(function (a) {
  var e = document.createElement('div'); e.className = 'entry';
  var tile = document.createElement('div'); tile.className = 'tile';
  var inner = document.createElement('div');
  if (a.banner) { inner.className = 'banner'; inner.style.background = 'linear-gradient(135deg,' + a.banner[0] + ',' + a.banner[1] + ')'; }
  else { inner.className = 'icon'; inner.style.background = a.icon; }
  inner.textContent = a.t; tile.appendChild(inner);
  var name = document.createElement('div'); name.className = 'name'; name.textContent = a.n;
  e.appendChild(tile); e.appendChild(name); row.appendChild(e); entries.push(e);
});

var contentW = PAD * 2 + APPS.length * (TILE_W + GAP);
function show() {
  entries.forEach(function (e, i) { e.classList.toggle('focus', !onGear && i === cur); });
  gear.classList.toggle('focus', onGear);
  // Same rule as scrollToItem(): centre the focused tile, clamp at both ends.
  var e = entries[cur], centre = e.offsetLeft + e.offsetWidth / 2;
  var target = contentW <= VIEWPORT ? 0 : Math.max(0, Math.min(centre - VIEWPORT / 2, contentW - VIEWPORT));
  row.style.transform = 'translateX(' + (-target) + 'px)';
}
document.addEventListener('keydown', function (ev) {
  var k = ev.key;
  if (k === 'ArrowRight' && !onGear && cur < entries.length - 1) cur++;
  else if (k === 'ArrowLeft' && !onGear && cur > 0) cur--;
  else if (k === 'ArrowUp' && !onGear) onGear = true;
  else if (k === 'ArrowDown' && onGear) onGear = false;   // returns to the last selected tile
  else return;
  ev.preventDefault(); show();
});

function tick() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
}
tick(); setInterval(tick, 20000);

var stage = document.getElementById('stage');
function fit() {
  var s = Math.min(innerWidth / 961, innerHeight / 541);
  stage.style.transform = 'translate(' + ((innerWidth - 961 * s) / 2) + 'px,' + ((innerHeight - 541 * s) / 2) + 'px) scale(' + s + ')';
}
addEventListener('resize', fit); fit(); show();
if (location.hash === '#clean') document.getElementById('note').style.display = 'none';
</script>
</body>
</html>
