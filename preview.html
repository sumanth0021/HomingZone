<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomingZone TV Preview</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#f8f9fc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.screen{position:relative;width:100vw;height:100vh;min-height:520px;overflow:hidden;background:linear-gradient(100deg,#061426 0%,#10253b 38%,#4a3029 72%,#9a431f 100%)}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 77% 26%,rgba(255,132,48,.62),transparent 35%),radial-gradient(ellipse at 63% 70%,rgba(255,95,27,.23),transparent 32%),linear-gradient(90deg,rgba(2,9,19,.58),transparent 66%),linear-gradient(0deg,rgba(4,8,15,.82),transparent 43%);pointer-events:none}.top{position:absolute;z-index:2;top:3.5%;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:40px;background:rgba(15,18,27,.52);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px);white-space:nowrap}.tab{border:0;background:transparent;color:#f6f7fb;padding:12px 20px;border-radius:30px;font-size:clamp(11px,1.1vw,16px);cursor:pointer}.tab.active{background:#fff;color:#111821;font-weight:700}.tab:focus,.utility:focus,.watch:focus,.info:focus,.app:focus{outline:2px solid white;outline-offset:3px}.utilities{position:absolute;right:3.8%;top:4%;z-index:2;display:flex;gap:18px;align-items:center;color:white;font-size:22px}.utility{background:transparent;border:0;color:white;font-size:21px;padding:5px 9px;cursor:pointer}.hero{position:absolute;left:5.5%;top:31%;z-index:1;max-width:43%}.kicker{font-size:clamp(9px,.75vw,12px);letter-spacing:.24em;color:#f3c49e;font-weight:700}h1{font-size:clamp(43px,5.5vw,92px);letter-spacing:.28em;line-height:1;margin:17px 0 16px;font-weight:750}.desc{font-size:clamp(14px,1.35vw,21px);line-height:1.45;color:#f2f3f6;max-width:510px}.actions{display:flex;align-items:center;gap:18px;margin-top:32px}.watch{border:0;border-radius:40px;background:#fff;color:#10151d;padding:15px 29px;font-size:clamp(13px,1.15vw,18px);font-weight:750;cursor:pointer}.info{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.13);color:#fff;font-size:20px;font-weight:700;cursor:pointer}.dots{position:absolute;bottom:27%;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:8px;background:rgba(235,240,248,.42)}.dot.active{width:20px;background:#fff}.dock{position:absolute;z-index:2;left:3.2%;right:3.2%;bottom:4%;height:16%;min-height:92px;max-height:150px;padding:12px 20px;border-radius:32px;border:1px solid rgba(255,255,255,.2);background:rgba(27,29,39,.58);box-shadow:0 15px 50px rgba(0,0,0,.25);backdrop-filter:blur(22px);display:flex;align-items:center;gap:14px;overflow-x:auto}.app{flex:1;min-width:105px;max-width:220px;height:100%;border-radius:19px;border:1px solid rgba(255,255,255,.12);background:rgba(3,8,16,.65);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .14s,border .14s}.app:focus,.app.selected{transform:scale(1.04);border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 25px rgba(0,0,0,.3)}.logo{font-weight:850;letter-spacing:-.06em;font-size:clamp(17px,2.4vw,36px)}.netflix{background:#f7f7f7;color:#e50914}.prime{background:#087ce8;color:white;font-size:clamp(13px,1.6vw,24px)}.disney{background:#07163f;color:#fff}.hulu{background:#061b16;color:#1ce783}.youtube{background:#f8f8f8;color:#141414}.apple{background:#030406;color:white}.foot{position:absolute;bottom:1.2%;left:4%;color:rgba(255,255,255,.36);font-size:9px;letter-spacing:.15em}@media(max-width:700px){.top{left:3%;transform:none;max-width:94%;overflow:auto}.tab{padding:10px}.utilities{display:none}.hero{top:27%;max-width:85%}.dots{bottom:22%}.dock{height:18%;left:3%;right:3%;padding:8px}.app{min-width:95px}}</style></head><body><main class="screen"><nav class="top"><button class="tab active">⌂ &nbsp;Home</button><button class="tab">Apps</button><button class="tab">Movies</button><button class="tab">Series</button><button class="tab">Library</button><button class="tab">⌕</button></nav><div class="utilities"><button class="utility">◉</button><span>│</span><button class="utility">⚙</button><button class="utility">●</button></div><section class="hero"><div class="kicker">A NEW WAY TO WATCH</div><h1>HOME</h1><div class="desc">Your entertainment, all in one place.<br>Pick something you love and settle in.</div><div class="actions"><button class="watch">▶ &nbsp; Explore Apps</button><button class="info">i</button></div></section><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><section class="dock"><div class="app selected" tabindex="0"><span class="logo netflix">NETFLIX</span></div><div class="app" tabindex="0"><span class="logo prime">prime video</span></div><div class="app" tabindex="0"><span class="logo disney">Disney+</span></div><div class="app" tabindex="0"><span class="logo hulu">hulu</span></div><div class="app" tabindex="0"><span class="logo youtube">▶ YouTube</span></div><div class="app" tabindex="0"><span class="logo apple">● tv+</span></div></section><div class="foot">HOMINGZONE · YOUR TV, YOUR SPACE</div></main><script>document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')}));document.querySelectorAll('.app').forEach(a=>a.addEventListener('focus',()=>{document.querySelectorAll('.app').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')}));document.querySelector('.watch').addEventListener('click',()=>document.querySelector('.app').focus());</script></body></html>
