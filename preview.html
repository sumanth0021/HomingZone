<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomingZone Discovery Preview</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#f8f9fc;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.screen{position:relative;width:100vw;height:100vh;min-height:520px;overflow:hidden;background:linear-gradient(120deg,#07182d,#142b43,#49312c,#9b4825);transition:background 1s}.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,9,19,.76),rgba(2,9,19,.12) 75%),linear-gradient(0deg,rgba(4,8,15,.82),transparent 44%);pointer-events:none}.top{position:absolute;z-index:2;top:3.5%;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:40px;background:rgba(15,18,27,.52);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px);white-space:nowrap}.tab{border:0;background:transparent;color:#f6f7fb;padding:12px 20px;border-radius:30px;font-size:clamp(11px,1.1vw,16px);cursor:pointer}.tab.active{background:#fff;color:#111821;font-weight:700}.utilities{position:absolute;right:3.8%;top:4%;z-index:2;display:flex;gap:18px;align-items:center;color:white;font-size:22px}.utility{background:transparent;border:0;color:white;font-size:21px;padding:5px 9px}.hero{position:absolute;left:5.5%;top:31%;z-index:1;max-width:43%}.kicker{font-size:clamp(9px,.75vw,12px);letter-spacing:.24em;color:#f3c49e;font-weight:700}h1{font-size:clamp(43px,5.5vw,92px);letter-spacing:.04em;line-height:1;margin:17px 0 16px;font-weight:750}.desc{font-size:clamp(14px,1.35vw,21px);line-height:1.45;color:#f2f3f6;max-width:510px}.watch{margin-top:30px;border:0;border-radius:40px;background:#fff;color:#10151d;padding:15px 29px;font-size:clamp(13px,1.15vw,18px);font-weight:750;cursor:pointer}.dots{position:absolute;bottom:27%;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;border-radius:8px;background:rgba(235,240,248,.42)}.dot.active{width:20px;background:#fff}.dock{position:absolute;z-index:2;left:3.2%;right:3.2%;bottom:4%;height:16%;min-height:92px;max-height:150px;padding:12px 20px;border-radius:32px;border:1px solid rgba(255,255,255,.2);background:rgba(27,29,39,.58);box-shadow:0 15px 50px rgba(0,0,0,.25);backdrop-filter:blur(22px);display:flex;align-items:center;gap:14px;overflow-x:auto}.app{flex:1;min-width:105px;max-width:220px;height:100%;border-radius:19px;border:1px solid rgba(255,255,255,.12);background:rgba(3,8,16,.65);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .14s,border .14s}.app:focus,.app.selected{transform:scale(1.04);border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 25px rgba(0,0,0,.3)}.logo{font-weight:850;letter-spacing:-.06em;font-size:clamp(17px,2.4vw,36px)}.netflix{background:#f7f7f7;color:#e50914}.prime{background:#087ce8;color:white;font-size:clamp(13px,1.6vw,24px)}.youtube{background:#f8f8f8;color:#141414}.hotstar{background:#121b48;color:#fff}.vlc{background:#f4a51c;color:#111}.foot{position:absolute;bottom:1.2%;left:4%;color:rgba(255,255,255,.36);font-size:9px;letter-spacing:.15em}@media(max-width:700px){.top{left:3%;transform:none;max-width:94%;overflow:auto}.utilities{display:none}.hero{top:27%;max-width:85%}.dots{bottom:22%}.dock{height:18%;left:3%;right:3%;padding:8px}.app{min-width:95px}}</style></head><body><main class="screen" id="screen"><nav class="top"><button class="tab active">⌂ &nbsp;Home</button><button class="tab">Apps</button><button class="tab">Discover</button><button class="tab">Library</button><button class="tab">⌕</button></nav><div class="utilities"><button class="utility">◉</button><span>│</span><button class="utility">⚙</button><button class="utility">●</button></div><section class="hero"><div class="kicker" id="kicker">AVAILABLE ON YOUR TV · NETFLIX</div><h1 id="title">Netflix</h1><div class="desc" id="desc">Continue your entertainment journey.<br>Selected from streaming apps installed on this TV.</div><button class="watch" id="open">▶ &nbsp; Open Netflix</button></section><div class="dots" id="dots"></div><section class="dock" id="dock"><div class="app selected" tabindex="0"><span class="logo netflix">NETFLIX</span></div><div class="app" tabindex="0"><span class="logo prime">prime video</span></div><div class="app" tabindex="0"><span class="logo youtube">▶ YouTube</span></div><div class="app" tabindex="0"><span class="logo hotstar">JioHotstar</span></div><div class="app" tabindex="0"><span class="logo vlc">VLC</span></div></section><div class="foot">HOMINGZONE · AUTO DISCOVERY FROM INSTALLED APPS</div></main><script>
const entries=[{name:'Netflix',tag:'AVAILABLE ON YOUR TV · NETFLIX',desc:'Continue your entertainment journey.',colors:'linear-gradient(120deg,#210d17,#6d1323,#b52c31)'},{name:'Prime Video',tag:'AVAILABLE ON YOUR TV · PRIME VIDEO',desc:'Discover something great to watch.',colors:'linear-gradient(120deg,#071b42,#0757a7,#168de2)'},{name:'YouTube',tag:'AVAILABLE ON YOUR TV · YOUTUBE',desc:'Explore videos, creators and more.',colors:'linear-gradient(120deg,#281013,#a5121b,#ed3434)'},{name:'JioHotstar',tag:'AVAILABLE ON YOUR TV · JIOHOTSTAR',desc:'Find your next film, series or live moment.',colors:'linear-gradient(120deg,#10102f,#282c86,#5555d8)'},{name:'VLC',tag:'AVAILABLE ON YOUR TV · VLC',desc:'Play your own movies and videos.',colors:'linear-gradient(120deg,#202020,#454545,#777777)'}];
let idx=0;const dots=document.getElementById('dots');entries.forEach((_,i)=>{let d=document.createElement('span');d.className='dot'+(i===0?' active':'');dots.appendChild(d)});
function show(i){idx=(i+entries.length)%entries.length;let e=entries[idx];document.getElementById('screen').style.background=e.colors;document.getElementById('kicker').textContent=e.tag;document.getElementById('title').textContent=e.name;document.getElementById('desc').innerHTML=e.desc+'<br>Selected from streaming apps installed on this TV.';document.getElementById('open').textContent='▶  Open '+e.name;[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===idx))}
setInterval(()=>show(idx+1),7000);document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active')}));document.querySelectorAll('.app').forEach((a,i)=>a.addEventListener('focus',()=>show(i%entries.length)));
</script></body></html>
